# =====================================================
# 统一训练配置文件（最终优化版）
# =====================================================

# 基本配置
exp_name: refactored_experiment
split_seed: 42
seed: 42

# 数据配置
data:
  data_dir: ADvsCN.ex001_2_p288
  data_name: ADvsCN.ex001_2_p288_pw24_all
  patch_size: 24
  num_folds: 5

# 缓存管理配置
cache:
  base_dir: ./cache
  auto_clean: false

# DenseNet预训练配置
densenet:
  pretrain:
    num_epochs: 70
    batch_size: 48        
    learning_rate: 0.0005
    weight_decay: 0.0001
    num_workers: 16       
    patience: 40
  model:
    growth_rate: 8
    num_init_features: 24

# 图边构建配置
graph:
  build:
    k_neighbors: 10              
    frequency_threshold: 0.3
    similarity_threshold: 0.7  
    similarity_metric: cosine
    batch_size: 64
    use_all_data: true
    # 👇 [新增] 空间正则化参数
    use_spatial_weight: true     
    spatial_sigma: 48.0          
  params:
    node_type: px
    edge_type: abscorr
    dist_type: euc_1+gau
    adj_norm: DAD

# 主训练配置
train:
  folds: [0, 1, 2, 3, 4]
  pre_epoch: 0
  num_epoch: 300
  stage_transition_epoch: 150  
  batch_size: 72           
  test_batch_size: 66
  
  # 优化器
  optimizer: SGD
  base_lr: 0.00005
  base_lr_mask: 1            # 
  weight_decay_adamw: 0.01
  weight_decay: 0.0005
  nesterov: true
  scheduler: auto             
  
  # 稀疏度正则化
  loss_weights:
    L_inv: 0.5
    L_sen: 0.25      
    L_pred: 1
    L_spu: 1
    lambda_l1: 0
    lambda_sparsity: 0.15       
    lambda_proto: 1.0
    lambda_edge_multiplier: 1.5 

# 模型配置
model:
  name: net.networks
  args:
    hidden1: [28]
    kernels: [2]
    hidden2: [28, 28]
    freeze_extractor: true

# 其他配置
misc:
  device: [0, 1, 2]
  gumble_tau: 0.1
  log_interval: 100
  save_interval: 5
  eval_interval: 5
  print_log: true