# =====================================================
# 统一训练配置文件（最终优化版）
# =====================================================

# 基本配置
exp_name: refactored_experiment
split_seed: 42
seed: 42

# 数据配置
data:
  data_dir: ADvsCN.ex001_2_p288
  data_name: ADvsCN.ex001_2_p288_pw24_all
  patch_size: 24
  num_folds: 5

# 缓存管理配置
cache:
  base_dir: ./cache
  auto_clean: false

# DenseNet预训练配置
densenet:
  pretrain:
    num_epochs: 70
    batch_size: 48        # 🔧 增加批次大小 (每GPU 16个)
    learning_rate: 0.0005
    weight_decay: 0.0001
    num_workers: 16       # 🔧 增加数据加载线程 (4倍GPU数)
    patience: 40
  model:
    growth_rate: 8
    num_init_features: 24

# 图边构建配置
graph:
  build:
    k_neighbors: 10              # 🔧 [修改] 从 5 提至 20，扩大候选范围，避免漏掉潜在因果边
    frequency_threshold: 0.3
    similarity_threshold: 0.7  
    similarity_metric: cosine
    batch_size: 64
    use_all_data: true
    # 👇 [新增] 空间正则化参数
    use_spatial_weight: true     # 开启距离加权
    spatial_sigma: 48.0          # 高斯核带宽 (建议 Patch Size * 2)
  params:
    node_type: px
    edge_type: abscorr
    dist_type: euc_1+gau
    adj_norm: DAD

# 主训练配置
train:
  folds: [0, 1, 2, 3, 4]
  pre_epoch: 40
  num_epoch: 180
  stage_transition_epoch: 100   # 在第 80 轮重启学习率进入 Stage 2
  batch_size: 72           # 🔧 增加批次大小 (每GPU 24个)
  test_batch_size: 66
  
  # 优化器
  optimizer: SGD
  base_lr: 0.0003
  base_lr_mask: 4.0            # 
  weight_decay_adamw: 0.01
  weight_decay: 0.0005
  nesterov: true
  scheduler: auto              # 代码现已强制使用 CosineAnnealingLR
  
  # 稀疏度正则化
  loss_weights:
    L_inv: 0.5
    L_sen: 0      # 暂时关闭 Sensitivity 测试，先专注 Invariance
    L_pred: 1
    L_spu: 1
    lambda_l1: 0
    lambda_sparsity: 0.15       # 🔧 [修改] 适当增加稀疏惩罚 (0.1 -> 0.2)
    lambda_proto: 1.0
    lambda_edge_multiplier: 4  # 🔧 [修改] 大幅增加边的惩罚权重 (2 -> 5)，强迫切断长距离弱连接

# 模型配置
model:
  name: net.networks
  args:
    hidden1: [28]
    kernels: [2]
    hidden2: [28, 28]
    freeze_extractor: true

# 其他配置
misc:
  device: [0, 1, 2]
  gumble_tau: 1
  log_interval: 100
  save_interval: 5
  eval_interval: 5
  print_log: true